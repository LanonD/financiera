name: PHP Lint

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/php-lint.yml"
      - "app/**/*.php"
      - "bootstrap/**/*.php"
      - "config/**/*.php"
      - "database/**/*.php"
      - "routes/**/*.php"

jobs:
  php-lint:
    name: PHP syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint PHP files
        run: find app bootstrap config database routes -name "*.php" -print0 | xargs -0 -n1 php -l
